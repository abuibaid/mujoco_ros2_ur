    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_vel_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController

    forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    forward_position_controller:
      type: position_controllers/JointGroupPositionController

    ur_configuration_controller:
      type: ur_controllers/URConfigurationController

    tool_contact_controller:
      type: ur_controllers/ToolContactController

    gripper_controller:
      type: position_controllers/GripperActionController

    # gripper_controller:
    #   type: forward_command_controller/ForwardCommandController

    # gripper_controller:
    #   type: effort_controllers/GripperActionController

    admittance_controller:
      type: admittance_controller/AdmittanceController

    camera_position_controller:
      type: position_controllers/JointGroupPositionController

    effort_controller:
      type: effort_controllers/JointGroupEffortController

speed_scaling_state_broadcaster:
  ros__parameters:
    state_publish_rate: 500.0


force_torque_sensor_broadcaster:
  ros__parameters:
    sensor_name: motor_fts
