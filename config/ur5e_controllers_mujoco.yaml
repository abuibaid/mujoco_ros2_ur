    #   - force.y
    #   - force.z
    #   - torque.x
    #   - torque.y
    #   - torque.z
    frame_id: motor_fts

effort_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 500.0
    action_monitor_rate: 20.0
    allow_integration_in_goal_trajectories: false
    allow_nonzero_velocity_at_trajectory_end: false
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
      shoulder_pan_joint: { trajectory: 1.0, goal: 0.2 }
      shoulder_lift_joint: { trajectory: 1.0, goal: 0.2 }
      elbow_joint: { trajectory: 1.0, goal: 0.2 }
      wrist_1_joint: { trajectory: 1.0, goal: 0.2 }
      wrist_2_joint: { trajectory: 1.0, goal: 0.2 }
      wrist_3_joint: { trajectory: 1.0, goal: 0.2 }
